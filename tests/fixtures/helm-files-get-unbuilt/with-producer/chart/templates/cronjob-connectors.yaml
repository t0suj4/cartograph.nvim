{{- if .Values.connect.enabled -}}
{{- $configSha := (include (print $.Template.BasePath "/configmap-connectors.yaml") . | sha256sum) -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-connectors
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            checksum/config: {{ $configSha }}
        spec:
          restartPolicy: Never
          containers:
            - name: visor
              image: example/utils:1.0
{{- end -}}
